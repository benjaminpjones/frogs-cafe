services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "5433:5432"
    volumes:
      - ./init-dbs.sql:/docker-entrypoint-initdb.d/init-dbs.sql

  server-a:
    build:
      context: ../..
      dockerfile: bik/e2e/Dockerfile.server
    environment:
      DATABASE_URL: postgres://postgres:postgres@host.docker.internal:5433/frogs_cafe_a?sslmode=disable
      PORT: 8080
      BASE_URL: http://localhost:8080
      ENVIRONMENT: e2e
      BIK_PEERS: http://host.docker.internal:8081
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"

  server-b:
    build:
      context: ../..
      dockerfile: bik/e2e/Dockerfile.server
    environment:
      DATABASE_URL: postgres://postgres:postgres@host.docker.internal:5433/frogs_cafe_b?sslmode=disable
      PORT: 8080
      BASE_URL: http://localhost:8081
      ENVIRONMENT: e2e
      BIK_PEERS: http://host.docker.internal:8080
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8081:8080"

  test:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ../../bik:/app
    command: sh -c "cd /app/bik-js && npm install --silent && NODE_PATH=/app/bik-js/node_modules npx tsx /app/e2e/test.ts"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SERVER_A: http://host.docker.internal:8080
      SERVER_B: http://host.docker.internal:8081
